# Stack de producción de Hexario.
#
#   cd infra
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d
#
# Las imágenes las publica GitHub Actions en GHCR. Este compose no buildea:
# sólo pullea y levanta. La landing queda en /, la PWA en /app/ y la API en
# /api/. El TLS y el dominio los maneja el Traefik que ya corre en la VPS;
# este nginx es interno y se descubre por labels en la red edge.
name: hexario

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${DB_USER:?definí DB_USER en infra/.env}
      POSTGRES_PASSWORD: ${DB_PASS:?definí DB_PASS en infra/.env}
      POSTGRES_DB: ${DB_NAME:?definí DB_NAME en infra/.env}
    volumes:
      - hexario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - hexario

  api:
    image: ghcr.io/${IMAGE_OWNER:-lautarotetamusa}/hexario-back:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    logging: *default-logging
    mem_limit: 512m
    env_file:
      - .env
    environment:
      NODE_ENV: prod
      PORT: 3001
      HOST: ${PUBLIC_URL:-https://hexario.thorque.com.ar}/api
      CORS_ORIGIN: ${PUBLIC_URL:-https://hexario.thorque.com.ar}
      # Sin puerto de front local en producción: no hace falta agregar
      # orígenes localhost a CORS.
      CORS_PORT: ""
      DB_HOST: postgres
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?definí JWT_SECRET en infra/.env}
    command: ["sh", "-c", "node dist/src/db/migrate.js && node dist/src/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - hexario

  app:
    image: ghcr.io/${IMAGE_OWNER:-lautarotetamusa}/hexario-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - hexario

  landing:
    image: ghcr.io/${IMAGE_OWNER:-lautarotetamusa}/hexario-landing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - hexario

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    # No publica 80/443: la VPS ya tiene Traefik escuchando ahí. Este nginx
    # sólo es el router interno de Hexario y Traefik lo descubre por labels.
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.hexario.rule=Host(`hexario.thorque.com.ar`)"
      - "traefik.http.routers.hexario.entrypoints=websecure"
      - "traefik.http.routers.hexario.tls.certresolver=le"
      - "traefik.http.routers.hexario.service=hexario"
      - "traefik.http.services.hexario.loadbalancer.server.port=80"
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
      landing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - hexario
      - edge

volumes:
  hexario_pgdata:

networks:
  hexario:
    driver: bridge
  # Red externa que ya usa Traefik en la VPS (ver /opt/onebox/traefik).
  edge:
    external: true
