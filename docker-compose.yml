# Stack mínimo para levantar Hexario: Postgres + API + PWA.
#
#   cp back/.env.example back/.env
#   ln -sfn back/.env .env
#   docker compose up --build
#
# La app queda en http://localhost:8080 y la API en http://localhost:3001.
# El .env de la raíz es un symlink a back/.env (una sola fuente de verdad).
# Si no existe, creá el symlink con: ln -s back/.env .env
services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hexario}
      POSTGRES_PASSWORD: ${DB_PASS:-hexario}
      POSTGRES_DB: ${DB_NAME:-hexario}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - hexario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hexario} -d ${DB_NAME:-hexario}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./back/.env
    environment:
      # Dentro de la red de compose, Postgres escucha en su puerto interno.
      DB_HOST: postgresdb
      DB_PORT: 5432
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgresdb:
        condition: service_healthy
    command: sh -c "node dist/src/db/migrate.js && node dist/src/index.js"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Vite la resuelve en build time: tiene que ser la URL pública del back.
        VITE_API_URL: http://localhost:${PORT:-3001}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  hexario_pgdata:
